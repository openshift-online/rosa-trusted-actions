type: object
required:
  - kind
  - items
  - total
  - page
  - limit
  - has_more
properties:
  kind:
    type: string
    enum:
      - AuditList
    description: Always "AuditList"
  items:
    type: array
    items:
      $ref: ./AuditEntry.yaml
    description: Audit log entries (sorted by timestamp descending)
  total:
    type: integer
    description: Total number of matching audit entries
    example: 3
  page:
    type: integer
    description: Current page number
    example: 1
  limit:
    type: integer
    description: Max results per page
    example: 50
  has_more:
    type: boolean
    description: Whether more results are available
    example: false
