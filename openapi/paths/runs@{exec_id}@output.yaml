get:
  tags:
    - Executions
  summary: Retrieve execution output
  description: >-
    Retrieve an execution's output.
    Only works for terminal executions
    (succeeded, failed, timed_out).
  operationId: getExecutionOutput
  parameters:
    - name: exec_id
      in: path
      required: true
      description: Execution ID (UUID)
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Execution output
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ExecutionOutput.yaml
    '404':
      description: No output or execution not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
          example:
            kind: Error
            code: not-found
            reason: No output for the execution or execution not found
