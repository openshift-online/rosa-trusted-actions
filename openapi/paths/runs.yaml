get:
  tags:
    - Executions
  summary: List executions
  description: >-
    List executions for the authenticated account with filtering and
    pagination. Results are sorted by created_at descending (most recent
    first). List responses include metadata only — use GET /runs/{id}
    with the include parameter for output and logs.
  operationId: listExecutions
  parameters:
    - name: page
      in: query
      description: Page number (1-based)
      schema:
        type: integer
        minimum: 1
        default: 1
    - name: limit
      in: query
      description: Max results per page (1-100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    - name: status
      in: query
      description: Filter by execution status
      schema:
        $ref: ../components/schemas/ExecutionStatus.yaml
    - name: action
      in: query
      description: Filter by Trusted Action name (exact match)
      schema:
        type: string
    - name: target
      in: query
      description: Filter by target cluster (exact match)
      schema:
        type: string
    - name: operator
      in: query
      description: Filter by operator name (exact match)
      schema:
        type: string
    - name: scope
      in: query
      description: Filter by scope
      schema:
        $ref: ../components/schemas/Scope.yaml
    - name: type
      in: query
      description: Filter by type
      schema:
        $ref: ../components/schemas/ActionType.yaml
    - name: output_status
      in: query
      description: Filter by output status
      schema:
        $ref: ../components/schemas/OutputStatus.yaml
    - name: approval_state
      in: query
      description: Filter by approval state
      schema:
        $ref: ../components/schemas/ApprovalState.yaml
    - name: dry_run
      in: query
      description: Filter by dry-run flag
      schema:
        type: string
        enum:
          - 'true'
          - 'false'
    - name: force
      in: query
      description: Filter by force flag
      schema:
        type: string
        enum:
          - 'true'
          - 'false'
    - name: since
      in: query
      description: >-
        Time filter. Accepts duration shorthand (30s, 5m, 1h, 24h, 7d)
        or RFC3339 timestamp (2026-06-10T00:00:00Z).
      schema:
        type: string
      examples:
        duration:
          summary: Last 24 hours
          value: 24h
        timestamp:
          summary: Since a specific time
          value: '2026-06-10T00:00:00Z'
  responses:
    '200':
      description: Paginated list of executions
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ExecutionList.yaml
