apiVersion: v1
kind: Namespace
metadata:
  name: openshift-monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: openshift-monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    rule_files:
      - /etc/prometheus/rules/*.yml
  rules.yml: |
    groups:
    - name: test-alerts
      rules:
      - alert: TestCriticalAlert
        expr: vector(1)
        for: 0s
        labels:
          severity: critical
          namespace: openshift-monitoring
          job: kube-state-metrics
      - alert: TestWarningAlert
        expr: vector(1)
        for: 0s
        labels:
          severity: warning
          namespace: openshift-monitoring
          job: kube-state-metrics
---
apiVersion: v1
kind: Pod
metadata:
  name: prometheus-k8s-0
  namespace: openshift-monitoring
  labels:
    app.kubernetes.io/name: prometheus
spec:
  containers:
  - name: prometheus
    image: quay.io/prometheus/prometheus:v3.4.1
    args:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/tmp/prometheus
    - --web.listen-address=:9090
    ports:
    - containerPort: 9090
    volumeMounts:
    - name: config
      mountPath: /etc/prometheus/prometheus.yml
      subPath: prometheus.yml
    - name: config
      mountPath: /etc/prometheus/rules/rules.yml
      subPath: rules.yml
    readinessProbe:
      httpGet:
        path: /-/ready
        port: 9090
      initialDelaySeconds: 5
      periodSeconds: 2
  volumes:
  - name: config
    configMap:
      name: prometheus-config
